name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug

      - name: Créer le Tag de Version
        id: tagger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          # Configuration manuelle pour l'authentification dans l'URL Git
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          git tag $VERSION_NAME
          git push origin $VERSION_NAME

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: Mise à jour ${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk

      - name: Installer Node.js et Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools

      - name: Déployer Firebase Hosting (Portail Web)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project launcher-enfant

      - name: Mettre à jour Firebase Database (Alertes Téléphones)
        run: |
          cat << 'EOF' > update_db.js
          const admin = require("firebase-admin");
          const serviceAccount = JSON.parse(process.env.FIREBASE_CREDENTIALS);
          const versionNumber = parseInt(process.env.RUN_NUMBER);
          const versionName = process.env.VERSION_NAME;
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app"
          });
          
          const db = admin.database();
          
          async function notifyUpdate(dbPath, fileName) {
            const url = `https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/${versionName}/${fileName}`;
            await db.ref(`app_updates/${dbPath}`).update({
              downloadUrl: url,
              latestVersionCode: versionNumber,
              latestVersionName: versionName,
              releaseNotes: "Mise à jour automatique disponible 🎉"
            });
            console.log(`Database mise à jour pour ${dbPath} !`);
          }
          
          async function run() {
             try {
                await notifyUpdate('child', 'app_enfant-debug.apk');
                await notifyUpdate('parent', 'app_parent-debug.apk');
                process.exit(0);
             } catch(e) {
                console.error("Erreur Database:", e);
                process.exit(1);
             }
          }
          
          run();
          EOF
          
          npm install firebase-admin
          node update_db.js
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
