name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Publier la Release GitHub (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Dernière Version (Dev)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour Firebase Database via Firebase CLI
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          RUN_NUM=${{ github.run_number }}
          cat << EOF > parent_update.json
          {
            "latestVersionCode": 99,
            "latestVersionName": "2.0-TEST",
            "downloadUrl": "https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_parent-debug.apk",
            "releaseNotes": "Test forcé : Nouvelle version v2.0-TEST disponible 🎉"
          }
          EOF

          cat << EOF > child_update.json
          {
            "latestVersionCode": 99,
            "latestVersionName": "2.0-TEST",
            "downloadUrl": "https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_enfant-debug.apk",
            "releaseNotes": "Test forcé : Nouvelle version v2.0-TEST disponible 🎉"
          }
          EOF

          npx -y firebase-tools@latest database:set /app_updates/parent parent_update.json --project launcher-enfant --non-interactive
          npx -y firebase-tools@latest database:set /app_updates/child child_update.json --project launcher-enfant --non-interactive
          
          echo "Base de données Firebase mise à jour avec succès via Firebase CLI !"
