name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Générer public/version.json dynamique (Toujours supérieur)
        run: |
          RUN_NUM=${{ github.run_number }}
          BASE_CODE=2000
          APP_CODE=$((BASE_CODE + RUN_NUM))
          SERVER_CODE=$((APP_CODE + 1))
          PARENT_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_parent-debug.apk"
          
          cat << EOF > public/version.json
          {
            "latestVersionCode": $SERVER_CODE,
            "latestVersionName": "2.3.$((RUN_NUM + 1))",
            "downloadUrl": "$PARENT_URL",
            "releaseNotes": "🎉 Nouvelle version v2.3.$((RUN_NUM + 1)) disponible !\n\n- Mises à jour automatiques et continues"
          }
          EOF
          echo "version.json généré avec le code serveur $SERVER_CODE (App code: $APP_CODE)"

      - name: Publier la Release GitHub (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Dernière Version (Dev)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk
            public/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour Firebase Database (Version cloud toujours supérieure)
        run: |
          RUN_NUM=${{ github.run_number }}
          BASE_CODE=2000
          APP_CODE=$((BASE_CODE + RUN_NUM))
          SERVER_CODE=$((APP_CODE + 1))
          PARENT_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_parent-debug.apk"
          CHILD_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_enfant-debug.apk"
          
          PAYLOAD='{"latestVersionCode": '$SERVER_CODE', "latestVersionName": "2.3.'$((RUN_NUM + 1))'", "downloadUrl": "'$PARENT_URL'", "releaseNotes": "🎉 Nouvelle version v2.3.'$((RUN_NUM + 1))' disponible !"}'
          CHILD_PAYLOAD='{"latestVersionCode": '$SERVER_CODE', "latestVersionName": "2.3.'$((RUN_NUM + 1))'", "downloadUrl": "'$CHILD_URL'", "releaseNotes": "🎉 Nouvelle version v2.3.'$((RUN_NUM + 1))' disponible !"}'

          curl -s -X PATCH -d "$PAYLOAD" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/families/FAM-8492/app_update.json"
          curl -s -X PATCH -d "$PAYLOAD" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/parent.json"
          curl -s -X PATCH -d "$CHILD_PAYLOAD" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/child.json"
          
          echo "Base de données Firebase mise à jour avec la version cloud $SERVER_CODE !"
