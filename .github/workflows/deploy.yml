name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications avec logs détaillés
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Supprimer l'ancienne Release (si existante)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "latest-dev" --yes || true
          git push --delete origin "latest-dev" || true

      - name: Créer le Tag de Version
        id: tagger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="latest-dev"
          RUN_NUMBER=${{ github.run_number }}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "RUN_NUMBER=$RUN_NUMBER" >> $GITHUB_ENV
          
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          git tag -f $VERSION_NAME
          git push -f origin $VERSION_NAME

      - name: Téléverser les APK vers Firebase Storage (Contournement GitHub Releases)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          cat << 'EOF' > upload_to_storage.js
          const admin = require("firebase-admin");
          const serviceAccount = JSON.parse(process.env.FIREBASE_CREDENTIALS);
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            storageBucket: "launcher-enfant.firebasestorage.app",
            databaseURL: "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app"
          });
          
          const bucket = admin.storage().bucket();
          const db = admin.database();
          
          async function uploadApk(filePath, destinationName, dbPath) {
            console.log(`Upload de ${destinationName}...`);
            await bucket.upload(filePath, {
              destination: destinationName,
              metadata: {
                contentType: 'application/vnd.android.package-archive',
                cacheControl: 'public, max-age=0'
              }
            });
            const file = bucket.file(destinationName);
            await file.makePublic();
            
            const url = `https://storage.googleapis.com/launcher-enfant.firebasestorage.app/${destinationName}`;
            
            const versionNumber = parseInt(process.env.RUN_NUMBER);
            await db.ref(`app_updates/${dbPath}`).update({
              downloadUrl: url,
              latestVersionCode: versionNumber,
              latestVersionName: "latest-dev",
              releaseNotes: "Mise à jour en cours de développement (Test)"
            });
            console.log(`Base de données mise à jour pour ${dbPath} avec le lien Storage direct !`);
          }
          
          async function run() {
             try {
                await uploadApk('app_enfant/build/outputs/apk/debug/app_enfant-debug.apk', 'app-enfant.apk', 'child');
                await uploadApk('app_parent/build/outputs/apk/debug/app_parent-debug.apk', 'app-parent.apk', 'parent');
                process.exit(0);
             } catch(e) {
                console.error("Erreur de déploiement:", e);
                process.exit(1);
             }
          }
          run();
          EOF
          npm install firebase-admin
          node upload_to_storage.js
