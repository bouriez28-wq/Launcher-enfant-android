name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug

      - name: Publier la Release GitHub (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Dernière Version (Dev)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour Firebase Database via REST API
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          VERSION_CODE=2
          VERSION_NAME="1.1"
          PARENT_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_parent-debug.apk"
          CHILD_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_enfant-debug.apk"
          
          echo "Mise à jour de Firebase pour le parent..."
          curl -s -X PATCH -d "{\"latestVersionCode\": $VERSION_CODE, \"latestVersionName\": \"$VERSION_NAME\", \"downloadUrl\": \"$PARENT_URL\", \"releaseNotes\": \"Nouvelle version disponible 🎉\"}" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/parent.json?auth=$FIREBASE_TOKEN"
          
          echo "Mise à jour de Firebase pour l'enfant..."
          curl -s -X PATCH -d "{\"latestVersionCode\": $VERSION_CODE, \"latestVersionName\": \"$VERSION_NAME\", \"downloadUrl\": \"$CHILD_URL\", \"releaseNotes\": \"Nouvelle version disponible 🎉\"}" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/child.json?auth=$FIREBASE_TOKEN"
          
          echo "Base de données Firebase mise à jour avec succès !"
