name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug

      - name: Publier la Release GitHub (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Dernière Version (Dev)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour Firebase Database (Alertes Téléphones)
        run: |
          cat << 'EOF' > update_db.js
          const firebaseAdmin = require("firebase-admin");
          const admin = firebaseAdmin.credential ? firebaseAdmin : (firebaseAdmin.default || firebaseAdmin);
          
          const rawCredentials = process.env.FIREBASE_CREDENTIALS;
          const cleaned = rawCredentials ? rawCredentials.trim() : '';
          
          if (!cleaned || !cleaned.startsWith('{')) {
             console.log("⚠️ FIREBASE_CREDENTIALS absent ou mal formé, premier caractère: " + (cleaned ? cleaned.substring(0, 10) : 'vide'));
             process.exit(0);
          }
          
          try {
            const serviceAccount = JSON.parse(cleaned);
            const versionNumber = parseInt(process.env.RUN_NUMBER);
            const versionName = "latest-dev";
            
            admin.initializeApp({
              credential: admin.credential.cert(serviceAccount),
              databaseURL: "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app"
            });
            
            const db = admin.database();
            
            async function notifyUpdate(dbPath, fileName) {
              const url = `https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/${versionName}/${fileName}`;
              await db.ref(`app_updates/${dbPath}`).update({
                downloadUrl: url,
                latestVersionCode: versionNumber,
                latestVersionName: versionName,
                releaseNotes: "Mise à jour automatique disponible 🎉"
              });
              console.log(`Database mise à jour avec succès pour ${dbPath} !`);
            }
            
            async function run() {
               try {
                  await notifyUpdate('child', 'app_enfant-debug.apk');
                  await notifyUpdate('parent', 'app_parent-debug.apk');
                  process.exit(0);
               } catch(e) {
                  console.error("Erreur écriture Database:", e);
                  process.exit(0);
               }
            }
            run();
          } catch(e) {
            console.log("⚠️ Erreur décodage JSON FIREBASE_CREDENTIALS:", e.message);
            process.exit(0);
          }
          EOF
          npm install firebase-admin
          node update_db.js
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          RUN_NUMBER: ${{ github.run_number }}
