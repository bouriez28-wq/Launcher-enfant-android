name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Générer public/version.json fixe (Version 3.0 Build 3000)
        run: |
          PARENT_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_parent-debug.apk"
          
          cat << EOF > public/version.json
          {
            "latestVersionCode": 3000,
            "latestVersionName": "3.0",
            "downloadUrl": "$PARENT_URL",
            "releaseNotes": "🎉 Version v3.0 stable disponible !"
          }
          EOF
          echo "version.json généré avec la version 3.0 (Build 3000)"

      - name: Publier la Release GitHub (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Dernière Version (Dev)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk
            public/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour Firebase Database (Version 3.0 Build 3000)
        run: |
          PARENT_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_parent-debug.apk"
          CHILD_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_enfant-debug.apk"
          
          PAYLOAD='{"latestVersionCode": 3000, "latestVersionName": "3.0", "downloadUrl": "'$PARENT_URL'", "releaseNotes": "🎉 Version v3.0 stable disponible !"}'
          CHILD_PAYLOAD='{"latestVersionCode": 3000, "latestVersionName": "3.0", "downloadUrl": "'$CHILD_URL'", "releaseNotes": "🎉 Version v3.0 stable disponible !"}'

          curl -s -X PATCH -d "$PAYLOAD" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/families/FAM-8492/app_update.json"
          curl -s -X PATCH -d "$PAYLOAD" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/parent.json"
          curl -s -X PATCH -d "$CHILD_PAYLOAD" "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/child.json"
          
          echo "Base de données Firebase mise à jour avec la version 3.0 (Build 3000) !"
