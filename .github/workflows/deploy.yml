name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug

      - name: Publier la Release GitHub (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Dernière Version (Dev)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour Firebase Database (Alertes Téléphones)
        run: |
          cat << 'EOF' > update_db.js
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getDatabase } = require("firebase-admin/database");
          
          const rawCredentials = process.env.FIREBASE_CREDENTIALS;
          const cleaned = rawCredentials ? rawCredentials.trim() : '';
          
          if (!cleaned || !cleaned.startsWith('{')) {
             console.log("⚠️ FIREBASE_CREDENTIALS absent ou mal formé.");
             process.exit(0);
          }
          
          try {
            const serviceAccount = JSON.parse(cleaned);
            const versionNumber = parseInt(process.env.RUN_NUMBER);
            
            initializeApp({
              credential: cert(serviceAccount),
              databaseURL: "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app"
            });
            
            const db = getDatabase();
            
            async function notifyUpdate(dbPath, driveUrl) {
              await db.ref(`app_updates/${dbPath}`).update({
                downloadUrl: driveUrl,
                latestVersionCode: versionNumber,
                latestVersionName: "latest-dev",
                releaseNotes: "Mise à jour disponible 🎉"
              });
              console.log(`Database mise à jour avec succès pour ${dbPath} !`);
            }
            
            async function run() {
               try {
                  await notifyUpdate('child', 'https://drive.google.com/uc?export=download&id=1wx_gApYFN9Qzpe2w27OmcK62oNimxbde');
                  await notifyUpdate('parent', 'https://drive.google.com/uc?export=download&id=1K2Ux0Q-6pMzIT2P1DHAokYnIDXHrNZcZ');
                  console.log("Mise à jour complète effectuée avec succès !");
                  process.exit(0);
               } catch(e) {
                  console.error("Erreur écriture Database:", e);
                  process.exit(0);
               }
            }
            run();
          } catch(e) {
            console.log("⚠️ Erreur décodage JSON FIREBASE_CREDENTIALS:", e.message);
            process.exit(0);
          }
          EOF
          npm install firebase-admin
          node update_db.js
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          RUN_NUMBER: ${{ github.run_number }}
