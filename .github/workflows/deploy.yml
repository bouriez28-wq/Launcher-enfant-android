name: Compilation et Création Release GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compiler les applications (Enfant et Parent)
        run: ./gradlew assembleDebug
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Publier la Release GitHub (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: Dernière Version (Dev)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app_enfant/build/outputs/apk/debug/app_enfant-debug.apk
            app_parent/build/outputs/apk/debug/app_parent-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mettre à jour Firebase Database via REST API (Forçage version 99999)
        run: |
          PARENT_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_parent-debug.apk"
          CHILD_URL="https://github.com/bouriez28-wq/Launcher-enfant-android/releases/download/latest-dev/app_enfant-debug.apk"
          
          echo "Mise à jour de Firebase pour le parent..."
          curl -s -X PATCH -d '{"latestVersionCode": 99999, "latestVersionName": "9.9.9", "downloadUrl": "'$PARENT_URL'", "releaseNotes": "Test forcé ultime : Nouvelle version v9.9.9 disponible 🎉"}' "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/parent.json"
          
          echo "Mise à jour de Firebase pour l'enfant..."
          curl -s -X PATCH -d '{"latestVersionCode": 99999, "latestVersionName": "9.9.9", "downloadUrl": "'$CHILD_URL'", "releaseNotes": "Test forcé ultime : Nouvelle version v9.9.9 disponible 🎉"}' "https://launcher-enfant-default-rtdb.europe-west1.firebasedatabase.app/app_updates/child.json"
          
          echo "Base de données Firebase mise à jour avec le code 99999 !"
